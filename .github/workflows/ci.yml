name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and protocol tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate JSON contracts independently
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate_contracts.ps1
      - name: Build portable source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python -B scripts/package_plugin.py --output dist/atelier-3d-ci.zip
